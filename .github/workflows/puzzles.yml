name: Build Puzzles
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch 10,000 Puzzles
        run: |
          node -e '
          const fs = require("fs");
          (async () => {
            const puzzles = [];
            for (let offset = 0; offset < 10000; offset += 100) {
              try {
                const url = `https://huggingface.co{offset}&length=100`;
                const res = await fetch(url, { headers: { "User-Agent": "GrandmasterArena/1.0" } });
                if (!res.ok) { await new Promise(r => setTimeout(r, 2000)); offset -= 100; continue; }
                const data = await res.json();
                if (!data.rows) { await new Promise(r => setTimeout(r, 2000)); offset -= 100; continue; }
                for (const item of data.rows) {
                  const r = item.row;
                  puzzles.push({
                    id: r.PuzzleId,
                    f: r.FEN,
                    m: String(r.Moves).trim().split(/\s+/),
                    r: Number(r.Rating),
                    t: (Array.isArray(r.Themes) ? r.Themes : String(r.Themes).trim().split(/\s+/)).slice(0, 3)
                  });
                }
                await new Promise(r => setTimeout(r, 120));
              } catch (err) {
                await new Promise(r => setTimeout(r, 2000));
                offset -= 100;
              }
            }
            puzzles.sort((a, b) => a.r - b.r);
            fs.mkdirSync("public", { recursive: true });
            fs.writeFileSync("public/puzzles.txt", JSON.stringify(puzzles));
            console.log("Saved", puzzles.length, "puzzles");
          })();
          '
      - name: Upload Downloadable File
        uses: actions/upload-artifact@v4
        with:
          name: puzzles-txt
          path: public/puzzles.txt
      - name: Commit to Repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/puzzles.txt
          git commit -m "Add 10,000 puzzles" || true
          git push || true
