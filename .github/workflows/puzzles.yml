name: Build Puzzles
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and Extract 10,000 Puzzles
        run: |
          pip install -q duckdb
          curl -fSL -o puzzles.parquet "https://huggingface.co/datasets/Lichess/chess-puzzles/resolve/refs%2Fconvert%2Fparquet/default/train/0000.parquet"
          python - << 'EOF'
          import duckdb, json, os

          rows = duckdb.sql("SELECT PuzzleId, FEN, Moves, Rating, Themes FROM 'puzzles.parquet' LIMIT 10000").fetchall()
          puzzles = []
          for pid, fen, moves, rating, themes in rows:
              theme_list = themes.split() if isinstance(themes, str) else list(themes)
              puzzles.append({
                  "id": str(pid),
                  "f": str(fen),
                  "m": str(moves).strip().split(),
                  "r": int(rating),
                  "t": [str(x) for x in theme_list[:3]]
              })

          assert len(puzzles) == 10000, f"Expected 10000 puzzles, got {len(puzzles)}"
          puzzles.sort(key=lambda x: x["r"])

          os.makedirs("public", exist_ok=True)
          with open("public/puzzles.txt", "w", encoding="utf-8") as f:
              json.dump(puzzles, f, separators=(",", ":"))

          os.remove("puzzles.parquet")
          print("SUCCESS! Saved exact count:", len(puzzles))
          EOF
      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzles-txt
          path: public/puzzles.txt
      - name: Commit to Repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/puzzles.txt
          git commit -m "Add 10,000 real puzzles"
          git push
