name: Build Puzzles
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stream 10,000 Puzzles Directly from Lichess
        run: |
          which zstd || (sudo apt-get update && sudo apt-get install -y zstd)
          (curl -sL https://lichess.org | zstd -d -q | head -n 10001 > puzzles.csv) || true
          node -e '
          const fs = require("fs");
          const lines = fs.readFileSync("puzzles.csv", "utf8").trim().split("\n").slice(1);
          const puzzles = lines.map(line => {
            const c = line.split(",");
            return {
              id: c[0],
              f: c[1],
              m: c[2].trim().split(" "),
              r: Number(c[3]),
              t: (c[7] || "").trim().split(" ").slice(0, 3)
            };
          }).filter(p => p.f && p.m.length > 1);
          puzzles.sort((a, b) => a.r - b.r);
          fs.mkdirSync("public", { recursive: true });
          fs.writeFileSync("public/puzzles.txt", JSON.stringify(puzzles));
          console.log("Saved exact count:", puzzles.length);
          '
      - name: Upload Downloadable File
        uses: actions/upload-artifact@v4
        with:
          name: puzzles-txt
          path: public/puzzles.txt
      - name: Commit to Repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/puzzles.txt
          git commit -m "Add 10,000 puzzles" || true
          git push || true
