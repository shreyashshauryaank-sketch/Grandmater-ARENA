name: Build All Openings
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All Lichess Openings
        run: |
          mkdir -p public
          curl -fSL https://githubusercontent.com > public/openings.tsv
          tail -n +2 <(curl -fSL https://githubusercontent.com) >> public/openings.tsv
          tail -n +2 <(curl -fSL https://githubusercontent.com) >> public/openings.tsv
          tail -n +2 <(curl -fSL https://githubusercontent.com) >> public/openings.tsv
          tail -n +2 <(curl -fSL https://githubusercontent.com) >> public/openings.tsv
      - name: Commit to Repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/openings.tsv
          git commit -m "Add all 3,600+ Lichess openings"
          git push
